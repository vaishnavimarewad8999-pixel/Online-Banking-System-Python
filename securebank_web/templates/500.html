{% extends "base.html" %}

{% block title %}Server Error - SecureBank{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="sb-card p-5">
        <h1 class="display-3 fw-bold text-danger">500</h1>
        <h3 class="fw-bold mb-3" style="color: var(--sb-navy);">Internal Server Error</h3>
        <p class="text-muted mb-4">An unexpected error occurred while processing your banking request. Please try again shortly.</p>
        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-sb-primary">
          <i class="bi bi-arrow-repeat me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
