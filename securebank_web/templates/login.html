{% extends "base.html" %}

{% block title %}Sign In - SecureBank{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="mb-4">
      <div class="d-flex align-items-center gap-2 mb-2">
        <span class="sb-brand-dot"></span>
        <span class="text-uppercase fw-bold text-muted small" style="letter-spacing: 1px;">SecureBank</span>
      </div>
      <h2 class="fw-bold mb-1" style="color: var(--sb-navy);">Welcome back</h2>
      <p class="text-muted small mb-0">Sign in to access your demo banking dashboard.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control border-start-0" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="Enter your username">
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0" id="password" name="password" required placeholder="Enter your password">
          <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-sb-primary py-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <span class="text-muted small">New to SecureBank?</span>
      <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none ms-1" style="color: var(--sb-teal);">Create account</a>
    </div>

    <div class="alert alert-light border mt-4 mb-0 text-center py-2 px-3 small text-muted">
      <i class="bi bi-shield-check text-success me-1"></i> Educational demo only &bull; No real money involved
    </div>
  </div>
</div>
{% endblock %}
