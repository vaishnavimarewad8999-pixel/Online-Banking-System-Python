{% extends "base.html" %}

{% block title %}Page Not Found - SecureBank{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="sb-card p-5">
        <h1 class="display-3 fw-bold text-muted">404</h1>
        <h3 class="fw-bold mb-3" style="color: var(--sb-navy);">Page Not Found</h3>
        <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}" class="btn btn-sb-primary">
          <i class="bi bi-house me-1"></i> Return to Safety
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
