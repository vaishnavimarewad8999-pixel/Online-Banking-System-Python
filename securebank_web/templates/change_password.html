{% extends "base.html" %}

{% block title %}Change Password - SecureBank{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="sb-card p-4">
        
        <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
          <div>
            <h3 class="fw-bold mb-1" style="color: var(--sb-navy);">Change Password</h3>
            <div class="text-muted small">Update your account credentials</div>
          </div>
          <div class="p-2 rounded-circle bg-light">
            <i class="bi bi-shield-lock fs-3" style="color: var(--sb-teal);"></i>
          </div>
        </div>

        <form method="POST" action="{{ url_for('change_password') }}">
          <div class="mb-3">
            <label for="current_password" class="form-label">Current Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="current_password" name="current_password" required autofocus placeholder="Enter current password">
              <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="current_password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="new_password" class="form-label">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="new_password" name="new_password" minlength="8" required placeholder="At least 8 characters">
              <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="new_password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="form-text small text-muted">Must contain at least 8 characters.</div>
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-key-fill"></i></span>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required placeholder="Re-enter new password">
              <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="confirm_password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-sb-primary py-2">
              <i class="bi bi-check2-circle me-1"></i> Update Password
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-sb-secondary py-2">
              Cancel
            </a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
